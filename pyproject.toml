[project]
name = "numcompute"
version = "1.0.0"
dependencies = ["numpy"]
requires-python = ">=3.13"
description = "COMP5004 Assignment 2.1 submission for the NumpyNewbies group"
readme = "README.md"

[project.urls]
Repository = "https://github.com/davetrumbull/comp_5004_ass2-1_numpy_newbies.git"
Issues = "https://github.com/davetrumbull/comp_5004_ass2-1_numpy_newbies/issues"

[project.optional-dependencies]

dev = [
    "pytest",
    "flake8",
    "pytest-cov",
    "matplotlib",
    "microbench",
    "pandas"
]
test = [
    "pytest",
    "pytest-cov"
]

[tool.setuptools.packages.find]
include = ["numcompute*"]

[tool.coverage.report]
exclude_also = [
    "@(abc\\.)?abstractmethod",
]